einleitung: Unser Erfolg liegt in der Zufriedenheit unserer Kunden.
bloecke:
  - type: bildtext
    titel: Führender Hersteller von Isolierprofilmaschinen
    inhalt: |
      Wir betreuen unsere Kunden zielgerichtet, fachkompetent und professionell. Als führender Hersteller von Isolierprofilmaschinen engagieren wir uns weltweit als starker Partner, der mit innovativen und kreativen Lösungen die Kundenprodukte gewinnbringend unterstützt und fördert.

      Durch die qualitativ hochstehenden Produkte sowie den erstklassigen Service haben wir das Vertrauen unserer Kunden gewonnen und bauen auf diesem Vertrauen eine gemeinsame Zukunft auf.
    bild: /uploads/heute.webp
    alt: Isolierprofilanlage
  - type: bildtext
    hell: true
    umgekehrt: true
    oberzeile: Heute
    titel: Drei Bereiche, ein Anspruch
    inhalt: |
      Heute stellen wir Maschinen in drei Bereichen her: **Aluminium-Fensterbau, Folierungen und Bürstenmontagen**. Die Firma ist seit 13 Jahren in der Führung von Urs Müller und beschäftigt regelmässig 15 bis 20 Mitarbeitende.

      Wir exportieren weltweit und sind branchenbekannt für beste Qualität im Maschinenbau, Neuentwicklungen, Anpassungen, Service und Support. Unsere Maschinen haben eine nahezu endlose Lebensdauer und sind einfach, wirtschaftlich und energiesparend entwickelt.
    bild: /uploads/heute-2.webp
    alt: Maschinenbau bei Müller
