# Demo-Seite auf GitHub Pages: baut bei jedem Push (auch aus dem CMS) und veröffentlicht unter
# https://<konto>.github.io/<repository>/
# Voraussetzung: öffentliches Repository (oder kostenpflichtiger GitHub-Plan),
# dann Repository → Settings → Pages → Source: «GitHub Actions».
name: Demo veröffentlichen

on:
  push:
    branches: [main, claude/beautiful-pasteur-yrfwm8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein neuer Build bricht den laufenden ab («cancelled» ist normal)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro check
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
